name = "kindo-worker"
main = "index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Public variables ───────────────────────────────────────────────────────────
[vars]
R2_PUBLIC_URL = "https://pub-943bd5d0ce6f4df9b0b9cbc05bec9e54.r2.dev"

# ── D1 Database ────────────────────────────────────────────────────────────────
# Step 1: wrangler d1 create kindo-db
# Step 2: Copy the database_id printed and paste below
# Step 3: wrangler d1 execute kindo-db --file=schema.sql
[[d1_databases]]
binding       = "DB"
database_name = "kindo-db"
database_id   = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ── R2 Bucket ─────────────────────────────────────────────────────────────────
# Your bucket is already created. No extra steps needed.
# Images are uploaded via the Worker binding and served via R2_PUBLIC_URL above.
[[r2_buckets]]
binding     = "R2"
bucket_name = "kindo-images"

# ── Deploy ────────────────────────────────────────────────────────────────────
# Run from this worker/ directory:
#   wrangler deploy
# The printed URL is your VITE_WORKER_URL — set it in Cloudflare Pages env vars.
